<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Álgebra Lineal</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <main class="calculator">
        <header class="calculator__header">
            <h1 class="calculator__title">Solución de Sistemas de Ecuaciones Lineales</h1>
            <p class="calculator__subtitle">Método de Eliminación por Filas</p>
        </header>

        <section class="config">
            <div class="config__group">
                <label class="config__label">Ecuaciones (m):</label>
                <input type="number" id="input-m" class="config__input" min="2" max="10" value="3">
            </div>
            <div class="config__group">
                <label class="config__label">Variables (n):</label>
                <input type="number" id="input-n" class="config__input" min="2" max="10" value="3">
            </div>
            <button id="btn-generate" class="btn btn--primary">Generar Espacios</button>
        </section>

        <section id="equation-container" class="equation-section hidden">
            <h2 class="equation-section__title">Ingresa las ecuaciones (Ej: 2x1 - 3x2 + x3 = 5)</h2>
            <div id="equation-list" class="equation-list"></div>
            <button id="btn-solve" class="btn btn--success">Resolver Sistema</button>
        </section>

        <section id="results" class="results hidden"></section>
    </main>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
