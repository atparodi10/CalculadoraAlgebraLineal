<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Lineal Tanix - Calculadora profesional de Álgebra Lineal: sistemas de ecuaciones, conversión de bases, vectores y matrices.">
    <title>{% block title %}Lineal Tanix{% endblock %}</title>
    <link rel="icon" href="{{ url_for('static', filename='img/logo.jpg') }}" type="image/jpeg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Fira+Code:wght@400;500;600&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/navbar.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/components.css') }}">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <!-- NAVBAR -->
    <nav class="navbar" id="main-navbar">
        <div class="navbar__container">
            <a href="{{ url_for('index') }}" class="navbar__brand">
                <img src="{{ url_for('static', filename='img/logo.jpg') }}" alt="Lineal Tanix Logo" class="navbar__logo">
                <span class="navbar__title">Lineal Tanix</span>
            </a>

            <button class="navbar__toggle" id="navbar-toggle" aria-label="Menú de navegación">
                <span></span><span></span><span></span>
            </button>

            <ul class="navbar__menu" id="navbar-menu">
                <li><a href="{{ url_for('index') }}" class="navbar__link {% if active_page == 'home' %}navbar__link--active{% endif %}">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                    Inicio
                </a></li>
                <li><a href="{{ url_for('page_ecuaciones') }}" class="navbar__link {% if active_page == 'ecuaciones' %}navbar__link--active{% endif %}">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
                    Ecuaciones
                </a></li>
                <li><a href="{{ url_for('page_conversion') }}" class="navbar__link {% if active_page == 'conversion' %}navbar__link--active{% endif %}">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
                    Conversión
                </a></li>
                <li><a href="{{ url_for('page_vectores') }}" class="navbar__link {% if active_page == 'vectores' %}navbar__link--active{% endif %}">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
                    Vectores
                </a></li>
                <li><a href="{{ url_for('page_matrices') }}" class="navbar__link {% if active_page == 'matrices' %}navbar__link--active{% endif %}">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="9" y1="3" x2="9" y2="21"/><line x1="15" y1="3" x2="15" y2="21"/></svg>
                    Matrices
                </a></li>
            </ul>

            <!-- Dark Mode Toggle -->
            <button class="theme-toggle" id="theme-toggle" aria-label="Cambiar tema">
                <svg class="theme-toggle__icon theme-toggle__icon--sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
                </svg>
                <svg class="theme-toggle__icon theme-toggle__icon--moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                </svg>
            </button>
        </div>
    </nav>

    <!-- MAIN CONTENT -->
    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <!-- FOOTER -->
    <footer class="footer">
        <div class="footer__container">
            <img src="{{ url_for('static', filename='img/logo.jpg') }}" alt="Lineal Tanix" class="footer__logo">
            <p class="footer__text">Lineal Tanix &copy; 2026 — Calculadora de Álgebra Lineal</p>
        </div>
    </footer>

    <!-- SCRIPTS -->
    <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
    <script src="{{ url_for('static', filename='js/navbar.js') }}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
