name: Pruebas Lineal Tanix
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Comprobar JavaScript
        run: find calculadora/static/js -name '*.js' -exec node --check {} \;
  navegador:
    # Playwright 1.56.1 dispone de Chromium y dependencias para Ubuntu 24.04.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: npm install --no-save playwright@1.56.1 jsdom@26.1.0
      - run: node tests/ui_dom.cjs
      - run: npx playwright install --with-deps chromium
      - name: Comprobar la interfaz
        run: |
          python -m flask --app calculadora run --port 5055 > /tmp/tanix.log 2>&1 &
          node tests/navegador.cjs
